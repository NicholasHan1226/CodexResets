<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Codex Resets</title>
    <style>
      :root {
        color-scheme: dark;
        background: #08090b;
        color: #f3f5f7;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(34rem, calc(100% - 3rem));
        border-top: 1px solid #20252d;
        padding-top: 2rem;
      }

      .code {
        color: #17c89a;
        font-size: 0.75rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 { font-size: clamp(1.75rem, 5vw, 2.75rem); margin: 0.7rem 0; }
      p { color: #9aa4b2; line-height: 1.65; }
      a { color: #17c89a; text-underline-offset: 0.25em; }
    </style>
  </head>
  <body>
    <main>
      <div class="code">404</div>
      <h1>Page not found</h1>
      <p>This URL does not exist. Return to the reset forecast.</p>
      <a href="/">View reset prediction</a>
    </main>
  </body>
</html>
