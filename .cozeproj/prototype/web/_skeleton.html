<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 字体 -->
  <link href="https://lf-code-agent.coze.cn/obj/x-ai-cn/fonts/google/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色 === */
      --color-primary:              #10A37F;
      --color-primary-container:    #0A3D2F;
      --color-on-primary:           #ffffff;
      /* === 背景 / 表面 === */
      --color-background:                 #0B0C0F;
      --color-surface-container-lowest:   #0F1013;
      --color-surface:                    #16171C;
      --color-surface-container:          #1C1D23;
      --color-surface-container-high:     #22232A;
      --color-surface-container-highest:  #282930;
      /* === 文字 === */
      --color-on-surface:           #F0F2F5;
      --color-on-surface-variant:   #7C8494;
      /* === 功能色 === */
      --color-success:  #22c55e;
      --color-error:    #ef4444;
      --color-warning:  #f59e0b;
      /* === 边框 === */
      --color-outline:          #26272E;
      --color-outline-variant:  #1A1B20;
      /* === 圆角 === */
      --radius-sm:   0.375rem;
      --radius-md:   0.5rem;
      --radius-lg:   0.625rem;
      --radius-xl:   0.75rem;
      --radius-2xl:  1rem;
      --radius-full: 9999px;
      /* === 阴影 === */
      --shadow-card:   0 1px 3px rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.15);
      --shadow-float:  0 8px 24px rgba(0,0,0,0.35), 0 2px 8px rgba(0,0,0,0.2);
      --shadow-dialog: 0 24px 48px rgba(0,0,0,0.5);
      /* === 字体 === */
      --font-sans: "Inter", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>

  <style>
    /* Glow pulse for active elements */
    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 0 4px rgba(16, 163, 127, 0.15), 0 0 12px rgba(16, 163, 127, 0.05); }
      50% { box-shadow: 0 0 8px rgba(16, 163, 127, 0.25), 0 0 24px rgba(16, 163, 127, 0.1); }
    }
    .glow-pulse { animation: glow-pulse 2.5s ease-in-out infinite; }

    /* Live dot breathing */
    @keyframes live-breathe {
      0%, 100% { box-shadow: 0 0 0 0 rgba(16, 163, 127, 0.4); }
      50% { box-shadow: 0 0 0 6px rgba(16, 163, 127, 0); }
    }
    .live-breathe { animation: live-breathe 2s ease-in-out infinite; }

    /* Chart area shimmer */
    @keyframes chart-shimmer {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.8; }
    }
    .chart-shimmer { animation: chart-shimmer 3.5s ease-in-out infinite; }

    /* Signal bar active */
    @keyframes signal-glow {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .signal-glow { animation: signal-glow 2s ease-in-out infinite; }

    /* Fade in on load */
    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in-up { animation: fade-in-up 0.5s ease-out forwards; }
    .fade-in-up-delay-1 { animation: fade-in-up 0.5s ease-out 0.1s forwards; opacity: 0; }
    .fade-in-up-delay-2 { animation: fade-in-up 0.5s ease-out 0.2s forwards; opacity: 0; }
    .fade-in-up-delay-3 { animation: fade-in-up 0.5s ease-out 0.3s forwards; opacity: 0; }
  </style>
</head>

<body class="bg-background text-on-surface font-sans min-h-screen">

  <!-- @nav:start 导航组件 -->
  <header class="bg-surface/60 backdrop-blur-md sticky top-0 z-50 border-b border-outline/10">
    <div class="max-w-7xl mx-auto px-4 md:px-6 h-14 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-primary/10 flex items-center justify-center glow-pulse">
          <i data-lucide="radar" class="w-4.5 h-4.5 text-primary"></i>
        </div>
        <div class="flex items-baseline gap-2">
          <span class="font-bold text-base text-on-surface tracking-tight">Codex Resets</span>
          <span class="text-[10px] font-mono text-on-surface-variant/60 bg-surface-container px-1.5 py-0.5 rounded">v2</span>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-1.5 text-xs font-mono text-on-surface-variant">
          <span class="w-1.5 h-1.5 rounded-full bg-primary live-breathe"></span>
          <span class="hidden sm:inline">LIVE</span>
        </div>
        <div class="flex items-center gap-1.5 text-xs font-mono text-on-surface-variant">
          <i data-lucide="clock" class="w-3.5 h-3.5"></i>
          <span id="header-time">12:00 UTC</span>
        </div>
      </div>
    </div>
  </header>
  <!-- @nav:end 导航组件 -->

  <!-- @main-content:start -->
  <main class="max-w-7xl mx-auto px-4 md:px-6 py-8">
    <!-- @main-content:end -->
  </main>

  <script>lucide.createIcons();</script>
</body>

</html>
