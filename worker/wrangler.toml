name = "codex-resets-pipeline"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Custom domain on the existing Cloudflare zone — workers.dev is
# DNS-poisoned in some regions, the site's own domain is far more reliable.
routes = [
  { pattern = "api.codexresets.cc", custom_domain = true }
]

[vars]
SITE_URL = "https://codexresets.cc"
PUBLIC_URL = "https://api.codexresets.cc"
TARGET_ACCOUNT = "thsottiaux"
VAPID_SUBJECT = "mailto:alerts@codexresets.cc"
VAPID_PUBLIC_KEY = "BPWIlBQjXI3-tAr4fGCUCE9ML-nzHgBTbVERdrXtWnrm9edT0tyOHgVScCkwfBR2iFTDcEduN0Q1FHJzCvUk_FI"
RESEND_FROM = "Codex Resets <alerts@codexresets.cc>"
RSSHUB_INSTANCES = "https://rsshub.app,https://rsshub.rssforever.com,https://rsshub.pseudoyu.com,https://rsshub.ktachibana.party"
SUPABASE_URL = "https://br-cute-ewe-1e52df81.supabase2.aidap-global.cn-beijing.volces.com"
# Anon key is already public in the frontend bundle — safe as a plain var
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjMzNjc3NDcxODksInJvbGUiOiJhbm9uIn0.vCwaH5SA0EDoCx0soIaspGjv_1NE4fBGnJkGOJvZGwU"

# Secrets (set via `wrangler secret put`):
#   SUPABASE_SERVICE_ROLE_KEY  — writes to reset_records / reads subscriptions
