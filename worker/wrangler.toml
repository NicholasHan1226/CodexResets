name = "codex-resets-pipeline"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Route API requests through the primary domain. Pages serves the UI while the
# Worker owns only /api/*; workers.dev is DNS-poisoned in some regions.
routes = [
  { pattern = "codexresets.cc/api/*", zone_name = "codexresets.cc" }
]

[vars]
SITE_URL = "https://codexresets.cc"
PUBLIC_URL = "https://codexresets.cc"
TARGET_ACCOUNT = "thsottiaux"
VAPID_SUBJECT = "mailto:alerts@codexresets.cc"
VAPID_PUBLIC_KEY = "BPWIlBQjXI3-tAr4fGCUCE9ML-nzHgBTbVERdrXtWnrm9edT0tyOHgVScCkwfBR2iFTDcEduN0Q1FHJzCvUk_FI"
RESEND_FROM = "Codex Resets <alerts@codexresets.cc>"
RSSHUB_INSTANCES = "https://rsshub.app,https://rsshub.rssforever.com,https://rsshub.pseudoyu.com,https://rsshub.ktachibana.party"
SUPABASE_URL = "https://wwhypilqiognyxkpqkss.supabase.co"
# Anon key is already public in the frontend bundle — safe as a plain var
SUPABASE_ANON_KEY = "sb_publishable_xC9TYkofqqQ6f181k7FQ8w_zZFzjeAQ"

# Secrets (set via `wrangler secret put`):
#   SUPABASE_SERVICE_ROLE_KEY  — writes to reset_records / reads subscriptions
#   VAPID_PRIVATE_KEY          — web push signing
#   RESEND_API_KEY             — email sending (optional until configured)
#   UNSUBSCRIBE_SECRET         — HMAC for email unsubscribe tokens
#   CRON_SECRET                — protects POST /api/run manual trigger
#   TURNSTILE_SECRET            — verifies public email subscription intake
#   HEALTH_ALERT_EMAIL          — receives deduplicated Worker failure alerts
#   RESEND_WEBHOOK_SECRET       — verifies bounce and complaint webhooks
#   X_BEARER_TOKEN              — optional official X API app-only token
#   X_CONSUMER_SECRET           — X app Consumer Secret for Activity webhook CRC/signatures

[[kv_namespaces]]
binding = "CACHE"
id = "dce055cfe41c4e819b3af1c2dd735a14"

[triggers]
crons = ["*/30 * * * *"]
